<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: purely additive. Chrome 108+ and Firefox 132+ honour it
     (the on-screen keyboard then shrinks the layout viewport, not just the visual one, so a
     fixed-position shell reflows instead of getting covered); an engine that does not recognise
     the key ignores it, same as viewport-fit=cover did before every engine understood that one.
     Safari has NOT shipped it as of mid-2026 (WebKit bug 259770 is still open, unassigned, "NEW"),
     so on Jacob's actual iPhone this line alone does nothing yet; main.ts's own visualViewport
     listener below is the part that covers Safari, because that API IS there even though this
     meta key is not. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Reflect</title>
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221c19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reflect">
<meta name="description" content="A private journal with a therapist who remembers.">
<!-- A real manifest file with a real icons array. Chrome will not offer to install without one,
     and Safari does not accept an SVG as the home screen icon, so both are PNGs on disk.
     scripts/publish.mjs writes all four files next to index.html. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Warm paper by day, warm lamplight by night. */
:root{
  --bg:oklch(0.975 0.013 78);--s:oklch(1 0.004 78);--s2:oklch(0.955 0.016 72);
  --t:oklch(0.26 0.028 42);--t2:oklch(0.49 0.03 48);
  --a:oklch(0.53 0.147 38);--a2:oklch(0.935 0.042 58);--ln:oklch(0.9 0.021 68);
  --bad:oklch(0.53 0.17 27);--shadow:oklch(0.4 0.06 50/.09);
  --on-a:oklch(0.99 0.01 78);
  /* The scale ramp. One rough end, one good end, so a 2 and a 5 stop looking the same.
     Tinted toward the accent's own warmth rather than a stock red to green. Lightness chosen
     so the token, used as text on a pale wash of itself, clears 4.5:1 in light mode: resolved
     through the real OKLCH-to-sRGB matrices rather than judged by eye, worst case 4.92:1
     (the original 0.56/0.62/0.52 measured as low as 3.19:1 on the middle band). */
  --lo:oklch(0.50 0.145 28);--mid:oklch(0.50 0.115 68);--hi:oklch(0.44 0.105 152);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.185 0.014 48);--s:oklch(0.243 0.018 48);--s2:oklch(0.285 0.02 50);
  --t:oklch(0.945 0.014 72);--t2:oklch(0.745 0.024 66);
  --a:oklch(0.775 0.108 52);--a2:oklch(0.32 0.045 44);--ln:oklch(0.34 0.022 50);
  --bad:oklch(0.74 0.14 30);--shadow:oklch(0 0 0/.3);
  --on-a:oklch(0.19 0.02 48);
  --lo:oklch(0.72 0.135 30);--mid:oklch(0.78 0.105 72);--hi:oklch(0.74 0.10 155);
}}
:root[data-theme="dark"]{
  --bg:oklch(0.185 0.014 48);--s:oklch(0.243 0.018 48);--s2:oklch(0.285 0.02 50);
  --t:oklch(0.945 0.014 72);--t2:oklch(0.745 0.024 66);
  --a:oklch(0.775 0.108 52);--a2:oklch(0.32 0.045 44);--ln:oklch(0.34 0.022 50);
  --bad:oklch(0.74 0.14 30);--shadow:oklch(0 0 0/.3);
  --on-a:oklch(0.19 0.02 48);
  --lo:oklch(0.72 0.135 30);--mid:oklch(0.78 0.105 72);--hi:oklch(0.74 0.10 155);
}
*{box-sizing:border-box}
/* A class that sets display beats the browser's own [hidden] rule, so anything hidden by the
   attribute comes back the moment it also has a class. .nowbox did exactly that. */
[hidden]{display:none!important}
html{height:100%}
html,body{overscroll-behavior:none}
/* This is a phone app. On a phone that has always been true because there was nowhere else
   for it to go; on a wide browser window it used to stretch out, and worse, unevenly: the
   bottom nav had no width limit at all while the screens above it did, so the two visibly
   disagreed with each other the moment the window was wider than a phone. Fixed properly: the
   whole shell is one fixed phone-sized box, centred, and nothing inside it measures itself
   independently any more. On an actual phone the box is exactly the viewport, so nothing about
   the phone experience changes; on a desktop window it now behaves like the same app sitting
   in the middle of the screen rather than a different, wider one.
   430 by 926 is a modern large phone's own logical size (the width of an iPhone 14/15 Pro
   Max, the height of an iPhone 12/13 Pro Max, close enough to any of them that nothing here
   depends on matching one exactly),
   picked as the reference so the desktop view reads at the same scale a real phone would,
   not an arbitrary in-between width. min() keeps it from overflowing a smaller window. */
html{display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden}
html,body{background:var(--s2)}
/* body, not #app, is the box .scrim/.sheet/.update-pill (all position:absolute, in main.ts) dock
   against: position:relative plus the same width/height #app used to carry makes body itself the
   phone-sized, centred frame, with #app simply filling it at inset:0. Anchoring those three to
   #app directly instead (tried and reverted, see main.ts's own comment on the sheet() append)
   would have put them inside a subtree that shell()'s app.replaceChildren() wholesale-replaces on
   every screen repaint, which can happen while a sheet is genuinely open, silently destroying it
   mid-interaction. Anchoring to body instead needs no such risk: body's own children are never
   touched by a screen repaint, only #app's are. */
body{position:relative;margin:0;color:var(--t);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;
  width:min(100vw,430px);height:min(100dvh,926px);overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;
  background:var(--bg);box-shadow:0 0 0 1px var(--ln),0 20px 60px oklch(0.1 0.01 40/.28);
  padding-top:env(safe-area-inset-top);overflow:hidden}
@media (min-width:431px) and (min-height:927px){ #app{border-radius:28px} }
/* Installed as its own app (iOS home screen, Android installed PWA), body must be pinned to
   the real screen with position:fixed;inset:0 rather than sized off vw/vh. Some standalone
   webviews report a stale or "desktop site" viewport to vw/vh units, which made the whole
   shell shrink to the 430x926 reference size and float in the middle of the real screen like
   a phone-within-a-phone, even though it fills the window correctly in an ordinary browser
   tab where vw/vh are trustworthy. inset:0 measures the actual viewport directly and cannot
   be fooled the same way. Desktop-tab preview keeps the floating-phone look untouched. */
@media (display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){
  html{align-items:stretch;justify-content:stretch}
  body{position:fixed;inset:0;width:auto;height:auto}
  #app{border-radius:0;box-shadow:none}
  /* The on-screen keyboard covering the compose bar or nav, round 89 flagged as unverified and
     round 90 could not summon a real keyboard to test either. But the mechanism is real and
     specific to this exact block: a fixed shell pinned with inset:0 is sized against the LAYOUT
     viewport, which iOS Safari does not shrink when the keyboard opens (only the VISUAL viewport
     shrinks), so the shell's own bottom, carrying nav and the compose/answer button, can render
     underneath the keyboard rather than above it. Left completely alone the rest of the time:
     [data-kb] is only ever set by main.ts's own visualViewport listener, and only while that
     listener has just measured a real, live gap between the visual and layout viewport of over
     150px, its read of "the keyboard is actually open right now" rather than an ordinary toolbar
     show/hide. Every other moment this rule does not exist and inset:0 above, chosen for the
     stale-vw/vh webview bug documented on that same declaration, is untouched. */
  body[data-kb]{inset:auto;top:var(--vvt,0px);left:0;right:0;bottom:auto;height:var(--vvh,100vh)}
}
/* A plain button reset so a real <button> can stand in for what used to be a clickable <div>
   (a card, a settings row, a switch), with every class below still supplying its own background
   and padding exactly as before. Without this, the browser's own button chrome and centred text
   would show through underneath. */
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;text-align:left;-webkit-appearance:none;appearance:none;margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:8px}

.top{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 8px;font-size:.9rem;color:var(--t2)}
.top b{color:var(--t);font-weight:700;display:block;font-size:1.02rem}
.av{width:38px;height:38px;border-radius:50%;background:var(--a);display:grid;place-items:center;color:var(--on-a);font:500 1.05rem Newsreader,serif;flex:none}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:8px 18px 18px;display:flex;flex-direction:column;gap:14px}
main::-webkit-scrollbar{display:none}
/* A tall child must scroll the page, never be squashed and clipped. .spacer sets its own
   flex and still grows, because a class beats this selector. */
main>*{flex-shrink:0}

.bubble{padding:12px 15px;border-radius:19px;max-width:87%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.them{align-self:flex-start;background:var(--s);color:var(--t);font:400 1.06rem/1.52 Newsreader,Georgia,serif;border-bottom-left-radius:7px;box-shadow:0 1px 3px var(--shadow)}
.me{align-self:flex-end;background:var(--a);color:var(--on-a);border-bottom-right-radius:7px;font-weight:500}
/* Lifeline's own number, wherever the therapist or a K10 reading names it: a real tap-to-call
   link rather than ten digits he has to leave the app and dial by hand in the one moment that is
   built to matter least for that kind of friction. Round 88 made it a link at all; round 89 found
   the hit target itself was only the bare text glyphs, as small as 16px tall in a wrapped bubble,
   this app's one link that can genuinely matter mid-crisis with an unsteady hand. inline-block
   plus a matching negative margin grows the real tappable box (padding included) without shifting
   where the word sits in the sentence; :active gives the same press feedback every other tappable
   thing in the app already has, so it reads as a control, not a formatting accident. */
.bubble a,.card a,.refl a{color:var(--a);font-weight:700;text-decoration:underline;
  display:inline-block;padding:7px 9px;margin:-7px -9px;border-radius:10px}
.bubble a:active,.card a:active,.refl a:active{background:color-mix(in oklch,var(--a) 16%,transparent)}
.me a{color:var(--on-a)}
.me a:active{background:color-mix(in oklch,var(--on-a) 20%,transparent)}

.inline{background:var(--s);border-radius:16px;padding:13px;align-self:stretch;font-size:.85rem;color:var(--t2);box-shadow:0 1px 3px var(--shadow)}
.scale{display:flex;gap:7px;margin-top:9px}
.scale button{flex:1;height:48px;border-radius:12px;border:0;background:var(--a2);color:var(--a);font-weight:800;font-size:1.05rem;transition:transform .12s ease}
.scale button:active{transform:scale(.93)}
.scale.k10{display:grid;grid-template-columns:repeat(5,1fr)}
.scale.k10 button{height:auto;min-height:58px;font-size:.72rem;line-height:1.18;padding:5px 3px;white-space:normal;font-weight:700}
/* Every scale in the app now runs the same rough to good logic; this is the one place it means
   something more, so it is drawn the same way rather than as its own thing. None of the time
   is the good end here, same direction as stress being reversed on the rating board. */
.scale.k10 button:nth-child(1){background:color-mix(in oklch,var(--hi) 20%,transparent);color:var(--hi)}
.scale.k10 button:nth-child(2){background:color-mix(in oklch,var(--hi) 12%,transparent);color:var(--hi)}
.scale.k10 button:nth-child(3){background:color-mix(in oklch,var(--mid) 14%,transparent);color:var(--mid)}
.scale.k10 button:nth-child(4){background:color-mix(in oklch,var(--lo) 11%,transparent);color:var(--lo)}
.scale.k10 button:nth-child(5){background:color-mix(in oklch,var(--lo) 18%,transparent);color:var(--lo)}
.k10prog{height:5px;border-radius:999px;background:var(--a2);overflow:hidden;margin-bottom:2px}
.k10prog i{display:block;height:100%;background:var(--a);transition:width .25s cubic-bezier(.16,1,.3,1)}

.compose{flex:none;display:flex;gap:8px;padding:8px 18px calc(12px + env(safe-area-inset-bottom))}
.compose textarea{flex:1;resize:none;border:1px solid var(--ln);border-radius:22px;padding:11px 16px;font:inherit;background:var(--s);color:var(--t);max-height:140px}
.compose textarea::placeholder{color:var(--t2)}
.compose button{border:0;border-radius:50%;width:46px;height:46px;background:var(--a);color:var(--on-a);font-size:1.2rem;flex:none;transition:transform .12s ease}
.compose button:active{transform:scale(.92)}
.compose button:disabled{opacity:.45}

nav{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--ln);background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom));font-size:.72rem;color:var(--t2)}
nav button{background:none;border:0;padding:5px 8px;display:grid;justify-items:center;gap:3px;transition:color .15s ease;position:relative}
nav button[aria-current="page"]{color:var(--a);font-weight:800}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* A new build has taken over in the background. Never reload out from under him mid sentence,
   so this is a choice, not an interruption, and it sits above the nav on every screen. */
.update-pill{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:30;border:0;border-radius:999px;
  padding:11px 18px;background:var(--a);color:var(--on-a);font:700 .82rem Manrope,sans-serif;
  box-shadow:0 4px 16px var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){
  /* Not the shared rise keyframe: that one lands on transform:none, which would silently
     replace this element's own translateX(-50%) centering the moment the entrance finished,
     leaving the pill sitting half its own width off centre forever after. Found by measuring
     its actual position rather than by eye. */
  .update-pill{animation:pill-rise .32s cubic-bezier(.16,1,.3,1) both}
  @keyframes pill-rise{from{opacity:0;transform:translateX(-50%) translateY(7px)}to{opacity:1;transform:translateX(-50%)}}
}

.card{background:var(--s);border-radius:18px;padding:15px 17px;font-size:.95rem;box-shadow:0 1px 3px var(--shadow)}
.card h3{font:500 1.18rem Newsreader,serif;margin-bottom:5px}
.card p{margin:.35rem 0;color:var(--t2)}
.card.tap{cursor:pointer;transition:transform .12s ease}
.card.tap:active{transform:scale(.985)}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--a2);color:var(--a);border-radius:999px;padding:6px 13px;font-size:.79rem;font-weight:800;align-self:flex-start}
.hero{font:500 1.55rem/1.3 Newsreader,Georgia,serif;color:var(--t);margin:2px 0 4px}
.primary{border:0;border-radius:999px;padding:16px 22px;background:var(--a);color:var(--on-a);font-weight:800;font-size:1.02rem;align-self:stretch;box-shadow:0 2px 8px var(--shadow);transition:transform .12s ease}
.primary:active{transform:scale(.975)}
.primary.small{padding:12px 18px;font-size:.92rem;align-self:flex-start}
.ghost{border:1px solid var(--ln);border-radius:999px;padding:11px 17px;background:transparent;color:var(--t);font-weight:700;align-self:flex-start;transition:transform .12s ease}
.ghost:active{transform:scale(.975)}
.spacer{flex:1;min-height:8px}

.done{margin:auto;text-align:center;display:grid;gap:14px;justify-items:center;padding:20px 4px}
.done h2{font:500 1.7rem/1.25 Newsreader,serif}
.done p{color:var(--t2);margin:0}

/* The five numbers, each carrying its own reading. Same order, now legible at a glance. */
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:var(--s);border-radius:16px;
  padding:13px 11px;box-shadow:0 1px 3px var(--shadow)}
.sum div{display:grid;gap:6px;justify-items:center;font-size:.62rem;color:var(--t2);text-align:center}
.sum b{font-size:1.22rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--t)}
.sum u{display:block;width:100%;height:4px;border-radius:999px;background:var(--s2);text-decoration:none;overflow:hidden}
.sum u i{display:block;height:100%;border-radius:999px;background:var(--t2)}
.sum .lo b{color:var(--lo)} .sum .lo u i{background:var(--lo)}
.sum .mid b{color:var(--mid)} .sum .mid u i{background:var(--mid)}
.sum .hi b{color:var(--hi)} .sum .hi u i{background:var(--hi)}

/* Bars measured from his own average, not from zero. Drawn from zero, a real gap between
   2.4 and 3.8 renders as almost no gap at all, and the chart argues against its own heading. */
/* Bars grow from a centre baseline, not from zero, so a real gap between two close numbers
   is still visible as a real gap. That baseline positioning used to be margin-top/bottom of
   50%, on the wrong assumption that a percentage margin resolves against the box's own
   height. It never does, on any side, including top and bottom: CSS always resolves a
   percentage margin against the CONTAINING BLOCK'S WIDTH. On a roughly 400px wide card that
   turned "half of 64px" into "half of 400px", so the bars shot about 170px past the top of
   their own card and rendered on top of the card above instead. Found by walking the actual
   points on screen with elementFromPoint rather than by re-reading the CSS.
   Fixed properly: each bar sits in its own slot that carries the flex sizing, and the coloured
   bar inside it is absolutely positioned against that slot's height using top/bottom, which
   unlike margin DOES resolve against height. */
.trend{position:relative;display:flex;gap:5px;height:64px;padding:0 4px}
.trend::before{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1px dashed var(--ln)}
.bwrap{flex:1;position:relative;height:100%}
.trend i{position:absolute;left:0;right:0;border-radius:3px;z-index:1;background:var(--a2);min-height:3px}
.trend i.up{bottom:50%;background:color-mix(in oklch,var(--hi) 45%,transparent)}
.trend i.dn{top:50%;background:color-mix(in oklch,var(--lo) 45%,transparent)}
.trend i.hi{background:var(--a)}
/* No horizontal bleed: at 7 bars on a phone a 4px overhang each side makes neighbouring
   labels overlap by 3px, which was measured rather than guessed. */
.trend i span{position:absolute;left:0;right:0;text-align:center;font-size:.58rem;color:var(--t2);font-style:normal;white-space:nowrap}
.trend i.up span{bottom:-16px} .trend i.dn span{top:-16px}
.avgline{font-size:.68rem;color:var(--t2);margin:18px 0 0}
.refl{font:400 1.1rem/1.62 Newsreader,Georgia,serif;white-space:pre-wrap}
.score{display:flex;align-items:baseline;gap:11px}
.score b{font:600 2.7rem/1 Newsreader,serif;font-variant-numeric:tabular-nums}
.band{font-size:.85rem;font-weight:800;color:var(--a)}
/* The one multi-hue element in the app, now drawn from the same lo/mid/hi ramp as everything
   else instead of its own hardcoded four-stop gradient. */
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--hi),var(--mid),var(--lo));position:relative;margin:9px 0 2px}
.bar i{position:absolute;top:-4px;width:4px;height:18px;background:var(--t);border-radius:2px}
.mem{font-size:.78rem;color:var(--a);font-weight:700;margin-top:7px}
.muted{color:var(--t2);font-size:.9rem}
.err{color:var(--bad);font-size:.9rem}
.err-safety{font-size:.9rem;font-weight:600;margin:4px 0}
/* Same fix as the .bubble/.card/.refl links above, and it belongs here at least as much: this is
   the one that shows when the live model call has already failed, so it is the last line, not a
   backup among several. */
.err-safety a{color:var(--a);font-weight:700;text-decoration:underline;
  display:inline-block;padding:7px 9px;margin:-7px -9px;border-radius:10px}
.err-safety a:active{background:color-mix(in oklch,var(--a) 16%,transparent)}
.typing{align-self:flex-start;color:var(--t2);font-size:.87rem;padding-left:8px;display:flex;gap:5px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t2);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

.skel{background:var(--s);border-radius:18px;padding:15px 17px;box-shadow:0 1px 3px var(--shadow);display:grid;gap:9px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--a2),var(--s2),var(--a2));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.login{margin:auto;max-width:370px;display:grid;gap:14px;text-align:center;padding:24px;overflow-y:auto}
.login h1{font:500 2.4rem Newsreader,serif;color:var(--a)}
.login input{border:1px solid var(--ln);border-radius:14px;padding:13px 15px;font:inherit;background:var(--s);color:var(--t)}
.manual{font-size:.98rem;line-height:1.62}
.manual h1{font:500 1.65rem Newsreader,serif;margin:4px 0 8px}
.manual h2{font:500 1.25rem Newsreader,serif;margin:20px 0 4px;color:var(--a)}
.manual li{margin:5px 0}
.offline{flex:none;background:var(--a2);color:var(--a);font-size:.82rem;font-weight:700;padding:7px 18px;text-align:center}

/* ---- The short night: every rating on one screen ---- */
.board{display:grid;gap:11px}
.row{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px}
.rname{font-size:.82rem;font-weight:700;color:var(--t)}
.track{display:flex;gap:6px}
/* The ramp. Rough at one end, good at the other, so which end you are picking is visible
   before you read the digit. Stress is reversed with direction:rtl, because for stress a 5
   is the bad end, and until now nothing in the app said so. */
.track button{flex:1;height:42px;border-radius:11px;border:0;background:var(--a2);color:var(--a);
  font-weight:800;font-size:1rem;transition:transform .12s ease,background .15s ease}
.track button:nth-child(1){background:color-mix(in oklch,var(--lo) 18%,transparent);color:var(--lo)}
.track button:nth-child(2){background:color-mix(in oklch,var(--lo) 11%,transparent);color:var(--lo)}
.track button:nth-child(3){background:color-mix(in oklch,var(--mid) 14%,transparent);color:var(--mid)}
.track button:nth-child(4){background:color-mix(in oklch,var(--hi) 12%,transparent);color:var(--hi)}
.track button:nth-child(5){background:color-mix(in oklch,var(--hi) 20%,transparent);color:var(--hi)}
.track button:active{transform:scale(.92)}
/* Never colour alone: the pick also gets a ring and a heavier weight. */
.track button.on{outline:2px solid currentColor;outline-offset:-2px;font-weight:800;
  background:color-mix(in oklch,currentColor 26%,transparent)}
.track.rev{direction:rtl}
.dirn{display:flex;justify-content:space-between;font-size:.6rem;color:var(--t2);padding:0 2px;margin-top:-4px}
.primary:disabled{opacity:.5}
.ghost.wide{align-self:stretch;text-align:center}
.now-pill{border-color:var(--a);color:var(--a);font-weight:800}
.ghost.end{align-self:flex-start;font-size:.88rem}
.twoup{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-self:stretch}
.twoup button{align-self:stretch;text-align:center;margin:0}
.ghost.on{background:var(--a2);border-color:var(--a);color:var(--a);font-weight:800}
h2.sect{font:500 1.15rem Newsreader,serif;margin-top:6px}

/* ---- Talking instead of typing ---- */
.compose button.mic{background:var(--a2);color:var(--a)}
.compose button.mic svg,.mic-line svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.compose button.mic.listening,.mic-line.listening{background:var(--a);color:var(--on-a);border-color:var(--a)}
@media (prefers-reduced-motion:no-preference){
  .compose button.mic.listening,.mic-line.listening{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
}

/* ---- Right now ---- */
.nowbox{display:grid;gap:9px}
.nowbox textarea{border:1px solid var(--ln);border-radius:16px;padding:13px 15px;font:inherit;
  background:var(--s);color:var(--t);resize:none}
.nowbox textarea::placeholder{color:var(--t2)}
.nowbox textarea.shake{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .nowbox textarea.shake{animation:shake .34s ease}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}
.breathe{margin:auto;display:grid;gap:14px;justify-items:center;text-align:center;padding:18px 4px}
.breathe .word{font:500 1.5rem Newsreader,serif;color:var(--a)}
.breathe .ring{width:170px;height:170px;border-radius:50%;background:var(--a2);display:grid;place-items:center}
.breathe .ring i{display:block;width:150px;height:150px;border-radius:50%;background:var(--a);
  opacity:.85;transform:scale(.42);transition:transform 4s cubic-bezier(.37,0,.63,1)}
.breathe p{margin:0}
@media (prefers-reduced-motion:reduce){.breathe .ring i{transform:scale(.8)!important}}

/* ---- Right now: one tap in, no typing ---- */
.feels{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.feels button{border:1px solid var(--ln);background:var(--s);color:var(--t);border-radius:14px;
  padding:15px 11px;font-weight:700;font-size:.92rem;text-align:center;line-height:1.25;
  box-shadow:0 1px 3px var(--shadow);transition:transform .12s ease,background .13s ease}
.feels button:active{transform:scale(.96);background:var(--s2)}
.feels button.other{grid-column:1 / -1;font-weight:600;color:var(--t2);background:transparent;box-shadow:none}

/* ---- Patterns: what is true before a claim is earned ---- */
.meter{height:8px;border-radius:999px;background:var(--a2);overflow:hidden;margin:11px 0 2px}
.meter i{display:block;height:100%;background:var(--a);border-radius:999px}

/* ---- Asking your own history ---- */
.search{display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--ln);
  border-radius:999px;padding:0 16px;box-shadow:0 1px 3px var(--shadow)}
.search svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--t2);stroke-width:1.9;stroke-linecap:round}
.search input{flex:1;border:0;background:none;padding:13px 0;font:inherit;color:var(--t);min-width:0}
.search input::placeholder{color:var(--t2)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--a)}
.results{display:flex;flex-direction:column;gap:14px}
.results:empty{display:none}

/* ---- Getting it onto the home screen ---- */
.card.install{border:1px solid var(--a)}
ol.steps{margin:8px 0 4px;padding-left:20px;color:var(--t2)}
ol.steps li{margin:6px 0}

/* ---- Home: two shapes, so the eye can sort them ----
   A card with the accent border is something waiting on him. A plain row is something to
   know. Before this everything on Home was the same rounded rectangle, which is why the
   check-in that was actually due sat below the fold behind two cards of pure information. */
.card.wants{border:1px solid var(--a)}
.sect-lbl{font:800 .64rem/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t2);margin:6px 0 -4px;padding-left:4px}
.rows{background:var(--s);border-radius:16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.rows .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;
  border-bottom:1px solid var(--ln);font-size:.9rem}
.rows .r:last-child{border-bottom:0}
.rows .r b{font-weight:700}
.rows .r span{color:var(--t2);font-size:.82rem;text-align:right;overflow-wrap:anywhere}
.rows .r.tap{cursor:pointer;transition:background .13s ease}
.rows .r.tap:active{background:var(--s2)}
.hero.sm{font-size:1.12rem;line-height:1.4;color:var(--t2)}

/* ---- One sheet, replacing eighteen browser dialogs ----
   prompt, confirm and alert cannot be styled, ignore both themes, and say "localhost" at the
   top. This is the app's own surface instead, built from the card and button styles above. */
.scrim{position:absolute;inset:0;background:oklch(0.15 0.02 40/.42);z-index:40;
  animation:fade .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:22px 22px 0 0;border-top:1px solid var(--ln);
  padding:14px 18px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:11px;max-height:86%;overflow-y:auto;
  box-shadow:0 -8px 32px var(--shadow);
  animation:rise-sheet .28s cubic-bezier(.16,1,.3,1) both}
.sheet>*{flex-shrink:0}
.sheet h3{font:500 1.25rem Newsreader,serif}
.sheet p{margin:0;color:var(--t2);font-size:.9rem}
.sheet .grip{width:36px;height:4px;border-radius:999px;background:var(--ln);align-self:center;margin-bottom:2px}
.sheet input,.sheet textarea{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;
  font:inherit;background:var(--s);color:var(--t);width:100%}
.sheet .primary.danger{background:var(--bad)}
.sheet .err{margin:0}
@media (prefers-reduced-motion:no-preference){
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise-sheet{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
}
/* Quick picks inside a sheet: times, dates, models. */
.picks{display:flex;flex-wrap:wrap;gap:7px}
.picks button{border:1px solid var(--ln);background:var(--s);color:var(--t);border-radius:999px;
  padding:9px 13px;font-size:.85rem;font-weight:700}
.picks button.on{border-color:var(--a);background:var(--a2);color:var(--a)}
.picks.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
.picks.grid4 button{text-align:center;border-radius:12px}
.picks button.danger.on{border-color:var(--bad);background:transparent;color:var(--bad)}

/* ---- The completion moment ----
   The streak number went because it could be lost. This cannot: one square per day of the
   last four weeks, filled where he wrote, and tonight's fills as the screen arrives. */
.quilt{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:196px}
.quilt i{display:block;aspect-ratio:1;border-radius:3px;background:var(--s2)}
.quilt i.f{background:color-mix(in oklch,var(--a) 34%,transparent)}
.quilt i.today{background:var(--a);box-shadow:0 0 0 3px color-mix(in oklch,var(--a) 26%,transparent)}
.quilt.mini{width:auto;gap:4px;grid-template-columns:repeat(7,10px)}
.quilt.mini i{border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .quilt i.today{animation:land .5s cubic-bezier(.34,1.56,.64,1) .18s both}
  @keyframes land{from{opacity:.2;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
}

/* ---- Moving between nights ---- */
.datestrip{display:flex;gap:5px;align-items:stretch}
.datestrip button{flex:1;border:0;background:var(--s);color:var(--t2);border-radius:11px;
  padding:7px 2px;font-size:.68rem;font-weight:700;display:grid;gap:2px;line-height:1.1;
  box-shadow:0 1px 3px var(--shadow);font-variant-numeric:tabular-nums}
.datestrip button u{text-decoration:none;font-size:.56rem;font-weight:600;opacity:.75}
.datestrip button.on{background:var(--a);color:var(--on-a)}
.datestrip .arrow{flex:0 0 40px;background:transparent;box-shadow:none;font-size:1.05rem;
  align-items:center;justify-items:center;display:grid}
.datestrip .arrow:disabled{opacity:.3}

.mem.tap{cursor:pointer}
.datelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.datelist button{border:1px solid var(--ln);background:var(--bg);color:var(--t);border-radius:999px;
  padding:6px 11px;font-size:.76rem;font-weight:700}

/* ---- Settings ---- */
.settings{gap:8px}
.grp{font:800 .7rem/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--t2);margin:14px 0 -2px;padding-left:4px}
/* A visible, persistent field name, for anywhere a placeholder alone used to carry it: it
   vanishes the moment a real value is typed, leaving nothing behind to say what the field was. */
.flabel{font:800 .68rem/1 Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--t2);margin:0 0 4px;text-align:left}
.list{background:var(--s);border-radius:16px;box-shadow:0 1px 3px var(--shadow);overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;
  border-bottom:1px solid var(--ln);font-size:.92rem}
.it:last-child{border-bottom:0}
.it.tap{cursor:pointer;transition:background .13s ease}
.it.tap:active{background:var(--s2)}
.it b{font-weight:700}
.it b.danger{color:var(--bad)}
.it .v{color:var(--t2);font-size:.85rem;text-align:right;overflow-wrap:anywhere}
.sw{width:42px;height:25px;border-radius:999px;background:var(--a);flex:none;position:relative;transition:background .18s ease}
.sw::after{content:"";position:absolute;top:3px;left:20px;width:19px;height:19px;border-radius:50%;
  background:var(--on-a);transition:left .18s cubic-bezier(.16,1,.3,1)}
.sw.off{background:var(--ln)}
.sw.off::after{left:3px;background:var(--s)}
.opts{background:var(--s2);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:1px solid var(--ln);background:var(--bg);color:var(--t);border-radius:12px;
  padding:10px 13px;font-size:.85rem;font-weight:600;text-align:left;flex:1 1 auto;min-width:44%}
.opts button.on{border-color:var(--a);background:var(--a2);color:var(--a);font-weight:800}
.opts button.done{flex:1 1 100%;text-align:center;background:var(--a);color:var(--on-a);border-color:var(--a);font-weight:800}
.editor{border:1px solid var(--ln);border-radius:14px;padding:13px 15px;background:var(--s);
  color:var(--t);font:400 .92rem/1.55 Manrope,sans-serif;resize:vertical;min-height:280px}
.saved{color:var(--a);font-weight:700}

/* ---- Its questions: a structured list instead of another paragraph to hand-edit ---- */
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{background:var(--s);border-radius:14px;padding:11px 13px;display:flex;gap:11px;
  align-items:flex-start;box-shadow:0 1px 3px var(--shadow);transition:opacity .15s ease}
.qrow.off{opacity:.5}
.qtxt{flex:1;font-size:.88rem;line-height:1.4}
.qsrc{display:block;font-size:.66rem;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;
  font-weight:800;margin-bottom:3px}
/* Sized to match .sw above (the switch used everywhere else in Settings): 34x20 was the smallest
   real interactive control in the app, well under a comfortable touch target. */
.qsw{width:42px;height:25px;border-radius:999px;background:var(--a);flex:0 0 42px;position:relative;
  margin-top:2px}
.qsw::after{content:"";position:absolute;top:3px;left:20px;width:19px;height:19px;border-radius:50%;
  background:var(--on-a);transition:left .16s cubic-bezier(.16,1,.3,1)}
.qsw.off{background:var(--ln)}
.qsw.off::after{left:3px;background:var(--s)}
.suggest{border:1px dashed var(--a);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.suggest span{font-size:.68rem;color:var(--a);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.suggest p{margin:0;font-size:.9rem;color:var(--t)}

/* ---- The first five minutes, shown once ---- */
.onb{display:grid;justify-items:center;gap:14px;text-align:center;padding:36px 8px 0}
.onbmark{width:60px;height:60px;border-radius:50%;background:var(--a);color:var(--on-a);
  display:grid;place-items:center;font:500 1.8rem Newsreader,serif}
.onb h2{font:500 1.4rem Newsreader,serif}
.onb p{color:var(--t2);margin:0;max-width:28ch}
.dots{display:flex;gap:6px;justify-content:center;align-self:center;margin-bottom:4px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ln);display:block}
.dots i.on{background:var(--a);width:16px;border-radius:999px;transition:width .18s ease}

/* ---- What I'm holding myself to ---- */
.commit{background:var(--s);border-radius:14px;padding:12px 14px;display:flex;gap:11px;
  align-items:flex-start;box-shadow:0 1px 3px var(--shadow)}
.cdot{width:7px;height:7px;border-radius:999px;background:var(--a);margin-top:6px;flex:0 0 7px}
.ctxt{flex:1;font-size:.9rem;line-height:1.42}
.cmeta{font-size:.74rem;color:var(--t2);margin-top:4px}

@media (prefers-reduced-motion:no-preference){
  .bubble,.card,.chip,.hero{animation:rise .38s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
